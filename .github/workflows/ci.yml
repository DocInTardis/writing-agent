name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify runtime without development dependencies
        run: |
          python -m pip install -c requirements-pinned.txt -r requirements.txt
          python -c "import writing_agent.launch; import writing_agent.web.app_v2"
      - name: Install test dependencies
        run: python -m pip install -r requirements-pinned.txt
      - name: Compile application
        run: python -m compileall -q writing_agent scripts
      - name: Run unit and integration tests
        run: python -m pytest -q tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: writing_agent/web/frontend_svelte/package-lock.json
      - run: npm ci
        working-directory: writing_agent/web/frontend_svelte
      - run: npm run build
        working-directory: writing_agent/web/frontend_svelte
