name: engine-perf
on:
  workflow_dispatch:
  push:
    paths:
      - "engine/**"
      - ".github/workflows/engine-perf.yml"

jobs:
  benches:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run benches
        run: cargo bench -p wa_benches
        working-directory: engine
