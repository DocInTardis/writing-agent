[package]
name = "writing-agent-tauri"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wa_core = { path = "../../engine/core", default-features = false }
wa_engine = { path = "../../engine/engine", default-features = false }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
