[package]
name = "writing-agent-desktop"
version = "0.2.0"
description = "Lightweight desktop shell for Writing Agent"
edition = "2021"
rust-version = "1.77"

[dependencies]
tauri = { version = "=2.11.1", features = [] }
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
tauri-build = { version = "=2.6.1", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
