[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "writing-agent"
version = "0.1.0"
description = "Writing Agent for report drafting, citation-aware generation, and document export."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["writing", "rag", "fastapi", "docx", "agent"]
authors = [
  { name = "writing-agent contributors" }
]
dependencies = [
  "fastapi>=0.109",
  "uvicorn>=0.24",
  "jinja2>=3.1",
  "python-multipart>=0.0.27",
  "python-docx>=1.1.0",
  "cairosvg>=2.9.0",
]

[project.optional-dependencies]
desktop = [
  "PySide6>=6.6",
]
tools = [
  "playwright>=1.57.0",
  "rapidocr-onnxruntime>=1.4.4",
]
dev = [
  "pytest>=7.4",
  "pip-audit>=2.8",
  "aiosmtpd>=1.4.5",
  "ruff>=0.11.0",
  "vulture>=2.14",
]

[project.scripts]
writing-agent = "writing_agent.launch:main"

[tool.setuptools.packages.find]
include = ["writing_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --ignore=tests/archive"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
  "writing_agent/web/frontend_svelte",
  "writing_agent/web/static",
  "writing_agent/web/app_v2.py",
  "writing_agent/web/app_v2_*.py",
  "scripts/release_preflight_runtime.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
